<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>CRIS PLATFORM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <span onclick="mudarPagina('ameacas')">Ameaças</span>

  <span onclick="mudarPagina('patente')">Patente</span>
</header>

<!-- CONTEÚDO -->
<main>

  <canvas id="mapa" width="800" height="500"></canvas>

  <h2>Ameaças</h2>
</section>

<section id="homebrew" class="pagina">
  <h2>Homebrew</h2>
</section>

<section id="patente" class="pagina">
  <h2>Patente</h2>
</section>

</main>

<!-- DADOS -->
<div class="diceBox">
  <input id="customDice" placeholder="Ex: 2d20+5">
  <button onclick="rolarCustom()">Rolar</button>
  <p id="resultadoDado"></p>
</div>

<script src="script.js"></script>
</body>
</html>
