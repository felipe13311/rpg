<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>BLOOD MON</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- MENU -->
<header class="menu">
<h1>BLOOD MON</h1>

<button onclick="ir('dashboard')">Dashboard</button>
<button onclick="ir('ficha')">Minha Ficha</button>
<button onclick="ir('campanhas')">Campanhas</button>
<button onclick="ir('owlbear')">Mapa</button>
<button onclick="logout()">Sair</button>
</header>

<main>

<!-- LOGIN -->
<section id="login" class="pagina ativa">
<h2>Login</h2>
<input id="user" placeholder="Usuário">
<input id="pass" type="password">
<button onclick="login()">Entrar</button>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="pagina">

<h2>Agentes</h2>
<table>
<thead><tr><th>Nome</th><th>Classe</th><th>Role</th></tr></thead>
<tbody id="tabelaAgentes"></tbody>
</table>

<h2>Campanhas</h2>
<table>
<thead><tr><th>Nome</th><th>Ação</th></tr></thead>
<tbody id="tabelaCampanhas"></tbody>
</table>

</section>

<!-- FICHA PRIVADA -->
<section id="ficha" class="pagina">
<h2>Minha Ficha</h2>

<input id="nomeFicha">
<input id="classeFicha">
<input id="hpFicha">

<input type="file" id="gifFicha">

<button onclick="salvarFicha()">Salvar</button>

<div id="previewFicha"></div>

</section>

<!-- CAMPANHAS -->
<section id="campanhas" class="pagina">

<input id="nomeCampanha">
<button onclick="criarCampanha()">Criar</button>

<ul id="listaCampanhas"></ul>

</section>

<!-- MAPA -->
<section id="owlbear" class="pagina">
<canvas id="mapa" width="800" height="400"></canvas>
</section>

</main>

<script src="script.js"></script>
</body>
</html>
