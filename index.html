<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>BLOOD MON</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
  <h1>BLOOD MON</h1>

  <span onclick="mudarPagina('agentes')">Agentes</span>
  <span onclick="mudarPagina('campanhas')">Campanhas</span>
</header>

<main>

<!-- AGENTES -->
<section id="agentes" class="pagina ativa">

<h2>Agentes</h2>

<input id="nomeAgente" placeholder="Nome">
<input id="classeAgente" placeholder="Classe">
<input type="file" id="avatarInput">

<select id="role">
<option value="jogador">Jogador</option>
<option value="mestre">Mestre</option>
</select>

<button onclick="criarAgente()">Criar</button>

<ul id="listaAgentes"></ul>

</section>

<!-- CAMPANHAS -->
<section id="campanhas" class="pagina">

<h2>Campanha</h2>

<input id="nomeCampanha" placeholder="Nome">
<button onclick="criarCampanha()">Criar</button>

<ul id="listaCampanhas"></ul>

<canvas id="mapa" width="800" height="400"></canvas>

<!-- CHAT -->
<div class="chat">
<div id="chatBox"></div>
<input id="chatInput">
<button onclick="enviarChat()">Enviar</button>
</div>

<!-- DADOS -->
<div class="dice">
<input id="diceInput" placeholder="2d20+5">
<button onclick="rolarDado()">Rolar</button>
<ul id="logDados"></ul>
</div>

</section>

</main>

<script src="script.js"></script>
</body>
</html>
