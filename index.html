<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Blood Moon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- MENU PRINCIPAL -->
<section id="menu" class="tela ativa">
<h1>BLOOD MOON</h1>

<div class="menuBox">
<button onclick="abrir('dashboard')">Dashboard</button>
<button onclick="abrir('ficha')">Minha Ficha</button>
<button onclick="abrir('campanhas')">Campanhas</button>
<button onclick="abrir('mapa')">Mapa</button>
</div>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="tela">
<button class="voltar" onclick="abrir('menu')">← Voltar</button>

<h2>Agentes</h2>
<table>
<thead><tr><th>Nome</th><th>Classe</th><th>Role</th></tr></thead>
<tbody id="tabelaAgentes"></tbody>
</table>

<h2>Campanhas</h2>
<table>
<thead><tr><th>Nome</th><th>Ação</th></tr></thead>
<tbody id="tabelaCampanhas"></tbody>
</table>

</section>

<!-- FICHA -->
<section id="ficha" class="tela">
<button class="voltar" onclick="abrir('menu')">← Voltar</button>

<h2>Minha Ficha</h2>

<input id="nomeFicha" placeholder="Nome">
<input id="classeFicha" placeholder="Classe">
<input id="hpFicha" placeholder="HP">

<input type="file" id="gifFicha">

<button onclick="salvarFicha()">Salvar</button>

<div id="previewFicha"></div>

</section>

<!-- CAMPANHAS -->
<section id="campanhas" class="tela">
<button class="voltar" onclick="abrir('menu')">← Voltar</button>

<h2>Campanhas</h2>

<input id="nomeCampanha" placeholder="Nome">
<button onclick="criarCampanha()">Criar</button>

<ul id="listaCampanhas"></ul>

</section>

<!-- MAPA -->
<section id="mapa" class="tela">
<button class="voltar" onclick="abrir('menu')">← Voltar</button>

<h2>Mapa</h2>

<canvas id="canvas" width="800" height="400"></canvas>

</section>

<script src="script.js"></script>
</body>
</html>
