<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>CRIS SYSTEM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>CRIS SYSTEM</h1>

<nav>
<button onclick="trocarAba('ficha')">Ficha</button>
<button onclick="trocarAba('inventario')">Inventário</button>
<button onclick="trocarAba('dados')">Dados</button>
<button onclick="trocarAba('combate')">Combate</button>
<button onclick="abrirADM()">██</button>
</nav>
</header>

<main>

<section id="ficha" class="aba ativa">
<input id="nome" placeholder="Nome">
<input id="classe" placeholder="Classe">
<input id="nivel" type="number" value="1">

<input id="for" placeholder="FOR">
<input id="des" placeholder="DES">
<input id="con" placeholder="CON">
<input id="int" placeholder="INT">
<input id="sab" placeholder="SAB">

<select id="armadura">
<option value="0">Sem armadura</option>
<option value="2">Leve</option>
<option value="4">Média</option>
<option value="6">Pesada</option>
</select>

<div class="barra"><div id="barraExs"></div></div>

<button onclick="calcular()">Atualizar</button>
<button onclick="salvarFicha()">Salvar</button>

<div id="resultado"></div>
</section>

<section id="inventario" class="aba">

<h3>Drogas</h3>
<button onclick="usarDroga('hemorred')">Hemorred</button>
<button onclick="usarDroga('carmine')">Carmine</button>
<button onclick="usarDroga('pulse')">Red Pulse</button>

<h3>Itens</h3>
<button onclick="addItem('Condensador')">Condensador</button>
<button onclick="addItem('Ampola')">Ampola</button>
<button onclick="addItem('Medalhão')">Medalhão</button>

<ul id="listaItens"></ul>
<div id="efeitos"></div>

</section>

<section id="dados" class="aba">
<button onclick="rolar(6)">d6</button>
<button onclick="rolar(20)">d20</button>
<button onclick="rolar(100)">d100</button>
<h3 id="resultadoDado"></h3>
</section>

<section id="combate" class="aba">

<input id="hpPlayer" placeholder="HP Player">
<input id="atkPlayer" placeholder="ATK Player">

<input id="hpEnemy" placeholder="HP Inimigo">
<input id="atkEnemy" placeholder="ATK Inimigo">

<button onclick="iniciarCombate()">Iniciar Combate</button>

<div id="logCombate"></div>

</section>

<section id="criaturas" class="aba">
<h2>ADM</h2>
<ul id="listaCriaturas"></ul>
<button onclick="interagirAnomalia()">Testar Anomalia</button>
</section>

</main>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>
</body>
</html>
