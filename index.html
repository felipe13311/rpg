<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Blood Moon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<script src="/socket.io/socket.io.js"></script>

<!-- MENU -->
<section id="menu" class="tela ativa">
<h1>BLOOD MOON</h1>
<div class="menuBox">
<button onclick="abrir('dashboard')">Dashboard</button>
<button onclick="abrir('agentes')">Agentes</button>
<button onclick="abrir('campanhas')">Campanhas</button>
<button onclick="abrir('mapa')">Mapa</button>
</div>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="tela">
<button class="voltar" onclick="abrir('menu')">←</button>

<h2>🎲 Rolagem</h2>
<input id="formulaDado" placeholder="1d20+5">
<button onclick="rolarDado()">Rolar</button>

<div id="logRolagens"></div>
</section>

<!-- AGENTES -->
<section id="agentes" class="tela">
<button class="voltar" onclick="abrir('menu')">←</button>

<h2>Agentes</h2>

<input id="nomeAgente" placeholder="Nome">
<input id="classeAgente" placeholder="Classe">
<button onclick="criarAgente()">Criar</button>

<ul id="listaAgentes"></ul>
</section>

<!-- FICHA COMPLETA -->
<section id="agenteFull" class="tela">
<button class="voltar" onclick="abrir('agentes')">←</button>

<h2 id="nomeAgenteFull"></h2>

<h3>Atributos</h3>
<input id="forcaFull" placeholder="Força">
<input id="agiFull" placeholder="Agilidade">
<input id="intFull" placeholder="Intelecto">
<input id="preFull" placeholder="Presença">

<h3>Derivados (AUTO)</h3>
<p id="vidaCalc"></p>
<p id="peCalc"></p>

<h3>Perícias (AUTO)</h3>
<p>Luta: <span id="lutaCalc"></span></p>
<p>Pontaria: <span id="pontariaCalc"></span></p>
<p>Furtividade: <span id="furtividadeCalc"></span></p>
<p>Percepção: <span id="percepcaoCalc"></span></p>

<h3>Inventário</h3>
<input id="itemNome" placeholder="Item">
<button onclick="addItem()">Adicionar</button>
<ul id="listaItens"></ul>

<h3>🎲 Testes</h3>
<button onclick="teste('forca')">FOR</button>
<button onclick="teste('agi')">AGI</button>
<button onclick="teste('int')">INT</button>
<button onclick="teste('pre')">PRE</button>

<button onclick="salvarAgenteFull()">Salvar</button>
</section>

<!-- CAMPANHAS -->
<section id="campanhas" class="tela">
<button class="voltar" onclick="abrir('menu')">←</button>

<input id="nomeCampanha" placeholder="Nome">
<button onclick="criarCampanha()">Criar</button>

<ul id="listaCampanhas"></ul>
</section>

<!-- MAPA -->
<section id="mapa" class="tela">
<button class="voltar" onclick="abrir('menu')">←</button>

<button onclick="carregarMapa()">Carregar Mapa</button>
<canvas id="canvas" width="800" height="400"></canvas>
</section>

<script src="script.js"></script>
</body>
</html>
