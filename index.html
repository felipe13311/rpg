<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Blood Moon VTT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<script src="/socket.io/socket.io.js"></script>

<!-- MENU -->
<section id="menu" class="tela ativa">
<h1>BLOOD MOON</h1>

<div class="menuBox">
<button data-go="dashboard">Dashboard</button>
<button data-go="agentes">Agentes</button>
<button data-go="mapa">Mapa</button>
<button data-go="campanhas">Campanhas</button>
</div>
</section>

<!-- DASHBOARD -->
<section id="dashboard" class="tela">
<button class="voltar" data-go="menu">←</button>

<h2>🎲 Rolagem</h2>
<input id="inputDado" placeholder="1d20+5">
<button id="btnRolar">Rolar</button>

<div id="log"></div>
</section>

<!-- AGENTES -->
<section id="agentes" class="tela">
<button class="voltar" data-go="menu">←</button>

<h2>Agentes</h2>

<input id="nomeAgente">
<input id="classeAgente">
<button id="btnCriarAgente">Criar</button>

<ul id="listaAgentes"></ul>
</section>

<!-- FICHA -->
<section id="ficha" class="tela">
<button class="voltar" data-go="agentes">←</button>

<h2 id="tituloFicha"></h2>

<h3>Atributos</h3>
<input id="forca">
<input id="agi">
<input id="int">
<input id="pre">

<h3>Derivados</h3>
<p id="hp"></p>
<p id="pe"></p>

<h3>Inventário</h3>
<input id="item">
<button id="addItem">Adicionar</button>
<ul id="inv"></ul>

<button id="salvarFicha">Salvar</button>
</section>

<!-- MAPA -->
<section id="mapa" class="tela">
<button class="voltar" data-go="menu">←</button>

<canvas id="canvas" width="800" height="500"></canvas>
</section>

<script src="script.js"></script>
</body>
</html>
