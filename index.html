<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>RPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🕯️ Sistema RPG</h1>
  <nav>
    <button onclick="trocarAba('ficha')">Ficha</button>
    <button onclick="trocarAba('dados')">Dados</button>
  </nav>
</header>

<main>

<section id="ficha" class="aba ativa">

  <h2>Ficha de Personagem</h2>

  <div class="grid">
    <input id="nome" placeholder="Nome">
    <input id="classe" placeholder="Classe">
    <input id="raca" placeholder="Raça">
    <input id="nivel" type="number" value="1">
  </div>

  <h3>Atributos</h3>

  <div class="grid">
    <input id="for" type="number" placeholder="FOR">
    <input id="des" type="number" placeholder="DES">
    <input id="con" type="number" placeholder="CON">
    <input id="int" type="number" placeholder="INT">
    <input id="sab" type="number" placeholder="SAB">
    <input id="car" type="number" placeholder="CAR">
  </div>

  <h3>Equipamento</h3>

  <div class="grid">
    <input id="arma" placeholder="Arma principal">
    <input id="armadura" placeholder="Armadura">
    <input id="item1" placeholder="Item 1">
    <input id="item2" placeholder="Item 2">
  </div>

  <textarea id="habilidade" placeholder="Habilidade Especial"></textarea>

  <button onclick="calcular()">Calcular</button>

  <div id="resultado"></div>

</section>

<section id="dados" class="aba">

  <h2>Rolador de Dados</h2>

  <button onclick="rolar(6)">d6</button>
  <button onclick="rolar(20)">d20</button>
  <button onclick="rolar(100)">d100</button>

  <h3 id="resultadoDado"></h3>

</section>

</main>

<script src="script.js"></script>
</body>
</html>
