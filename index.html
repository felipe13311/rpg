<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>CRIS UI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<!-- LADO ESQUERDO -->
<div class="left">

<h2 id="nomeDisplay">Personagem</h2>

<input id="nome" placeholder="Nome">
<input id="classe" placeholder="Classe">

<h3>Atributos</h3>

<div class="atributos">
  <input id="for" type="number" placeholder="FOR">
  <input id="agi" type="number" placeholder="AGI">
  <input id="int" type="number" placeholder="INT">
  <input id="pre" type="number" placeholder="PRE">
  <input id="vig" type="number" placeholder="VIG">
</div>

<button onclick="calcular()">Atualizar</button>

<div id="stats"></div>

</div>

<!-- LADO DIREITO -->
<div class="right">

<div class="tabs">
<button onclick="trocarAba('combate')">Combate</button>
<button onclick="trocarAba('inventario')">Inventário</button>
<button onclick="trocarAba('dados')">Dados</button>
</div>

<div id="combate" class="aba ativa">
<h3>Combate</h3>

<button onclick="novoAtaque()">Novo Ataque</button>
<div id="log"></div>

</div>

<div id="inventario" class="aba">
<h3>Inventário</h3>

<button onclick="usarDroga('hemorred')">Hemorred</button>
<button onclick="usarDroga('carmine')">Carmine</button>

<ul id="itens"></ul>
</div>

<div id="dados" class="aba">
<h3>Dados</h3>
<button onclick="rolar(20)">d20</button>
<p id="resultadoDado"></p>
</div>

</div>

</div>

<script src="script.js"></script>
</body>
</html>
