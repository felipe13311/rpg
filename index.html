<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>BLOOD MON</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
<h1>BLOOD MON</h1>
<button onclick="logout()">Logout</button>

<span onclick="mudarPagina('agentes')">Agentes</span>
<span onclick="mudarPagina('campanhas')">Campanhas</span>
</header>

<main>

<!-- LOGIN -->
<section id="login" class="pagina ativa">
<h2>Login</h2>
<input id="user" placeholder="Usuário">
<input id="pass" type="password" placeholder="Senha">
<button onclick="login()">Entrar</button>
</section>

<!-- AGENTES -->
<section id="agentes" class="pagina">
<h2>Agentes</h2>

<input id="nomeAgente" placeholder="Nome">
<input id="classeAgente" placeholder="Classe">
<input type="file" id="avatarInput">

<select id="role">
<option value="jogador">Jogador</option>
<option value="mestre">Mestre</option>
</select>

<button onclick="criarAgente()">Criar</button>

<ul id="listaAgentes"></ul>
</section>

<!-- CAMPANHAS -->
<section id="campanhas" class="pagina">

<input id="nomeCampanha" placeholder="Nome">
<button onclick="criarCampanha()">Criar</button>

<ul id="listaCampanhas"></ul>

<input type="file" id="mapUpload">

<canvas id="mapa" width="800" height="400"></canvas>

<!-- TURNOS -->
<button onclick="iniciarTurno()">Iniciar Turnos</button>
<p id="turnoAtual"></p>

<!-- CHAT -->
<div class="chat">
<div id="chatBox"></div>
<input id="chatInput">
<button onclick="enviarChat()">Enviar</button>
</div>

<!-- DADOS -->
<input id="diceInput" placeholder="2d20+5">
<button onclick="rolarDado()">Rolar</button>
<ul id="logDados"></ul>

</section>

</main>

<script src="script.js"></script>
</body>
</html>
